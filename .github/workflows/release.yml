# Builds MeraRAW for Windows and Linux (these CANNOT be cross-built from a Mac),
# and produces artifacts named:
#   MeraRAW Win <version>.exe
#   MeraRAW Linux <version>.AppImage  (+ .deb for Debian/Ubuntu, .rpm for Fedora/RHEL)
#
# macOS is intentionally NOT built here: tauri.conf.json hard-codes a Developer
# ID signingIdentity, which forces signing on every build — that succeeds
# locally (cert is in the keychain) but fails on a CI runner that has no cert.
# So we build + sign + notarize the two Mac DMGs locally instead, and let CI
# handle only Windows + Linux. (To move Mac into CI later you'd add the APPLE_*
# secrets AND a keychain-import step before the build.)
#
# Windows signing: set GitHub secrets WINDOWS_CERTIFICATE (base64 PFX) and
# WINDOWS_CERTIFICATE_PASSWORD. Without those secrets, installers remain unsigned.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: npm audit
        run: npm ci && npm audit --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          (cd src-tauri && cargo audit)

  build:
    needs: audit
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Win
            slug: win
            rust_targets: ""
            build_args: ""
          - os: ubuntu-22.04
            label: Linux
            slug: linux
            rust_targets: ""
            build_args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Import Windows code-signing certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\cert.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\\cert.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - name: Install frontend deps
        run: npm ci

      - name: Build the app
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Collect + rename installers
        id: pack
        shell: bash
        run: |
          set -e
          shopt -s nullglob globstar
          mkdir -p dist-release
          v="${{ steps.ver.outputs.version }}"
          label="${{ matrix.label }}"
          for f in src-tauri/target/**/release/bundle/**/*.dmg \
                   src-tauri/target/**/release/bundle/**/*.exe \
                   src-tauri/target/**/release/bundle/**/*.msi \
                   src-tauri/target/**/release/bundle/**/*.AppImage \
                   src-tauri/target/**/release/bundle/**/*.deb \
                   src-tauri/target/**/release/bundle/**/*.rpm; do
            ext="${f##*.}"
            dest="dist-release/MeraRAW ${label} ${v}.${ext}"
            cp "$f" "$dest"
            echo "packed: $dest"
          done
          echo "count=$(ls -1 dist-release | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeraRAW-${{ matrix.slug }}-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
