# Builds MeraRAW for Windows and Linux (these CANNOT be cross-built from a Mac),
# and produces artifacts named:
#   MeraRAW Win <version>.exe
#   MeraRAW Linux <version>.AppImage  (+ .deb)
#
# macOS is intentionally NOT built here: tauri.conf.json hard-codes a Developer
# ID signingIdentity, which forces signing on every build — that succeeds
# locally (cert is in the keychain) but fails on a CI runner that has no cert.
# So we build + sign + notarize the two Mac DMGs locally instead, and let CI
# handle only Windows + Linux. (To move Mac into CI later you'd add the APPLE_*
# secrets AND a keychain-import step before the build.)
#
# Trigger it by pushing a tag (e.g. `git tag v0.1.3 && git push origin v0.1.3`)
# — that also attaches the files to a GitHub Release — or run it manually from
# the Actions tab (uploads the files as downloadable run artifacts).
#
# Windows/Linux installers are unsigned (users click through the OS warning).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Win
            slug: win
            rust_targets: ""
            build_args: ""
          - os: ubuntu-22.04
            label: Linux
            slug: linux
            rust_targets: ""
            build_args: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build the app
        run: npm run tauri build -- ${{ matrix.build_args }}

      - name: Collect + rename installers
        id: pack
        shell: bash
        run: |
          set -e
          shopt -s nullglob globstar
          mkdir -p dist-release
          v="${{ steps.ver.outputs.version }}"
          label="${{ matrix.label }}"
          # Only this platform's bundles exist on this runner.
          for f in src-tauri/target/**/release/bundle/**/*.dmg \
                   src-tauri/target/**/release/bundle/**/*.exe \
                   src-tauri/target/**/release/bundle/**/*.msi \
                   src-tauri/target/**/release/bundle/**/*.AppImage \
                   src-tauri/target/**/release/bundle/**/*.deb; do
            ext="${f##*.}"
            dest="dist-release/MeraRAW ${label} ${v}.${ext}"
            cp "$f" "$dest"
            echo "packed: $dest"
          done
          echo "count=$(ls -1 dist-release | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MeraRAW-${{ matrix.slug }}-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
