# Builds MeraRAW for Windows and Linux (these CANNOT be cross-built from a Mac),
# and produces artifacts named:
#   MeraRAW Win <version>.exe
#   MeraRAW Linux <version>.AppImage  (+ .deb for Debian/Ubuntu, .rpm for Fedora/RHEL)
#
# macOS is intentionally NOT built here: tauri.conf.json hard-codes a Developer
# ID signingIdentity, which forces signing on every build — that succeeds
# locally (cert is in the keychain) but fails on a CI runner that has no cert.
# So we build + sign + notarize the two Mac DMGs locally instead, and let CI
# handle only Windows + Linux.
#
# Windows signing: set GitHub secrets WINDOWS_CERTIFICATE (base64 PFX) and
# WINDOWS_CERTIFICATE_PASSWORD. Without those secrets, installers remain unsigned
# (fine for beta; SmartScreen will warn).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Win
            slug: win
          - os: ubuntu-22.04
            label: Linux
            slug: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read version from package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Import Windows code-signing certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\\cert.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\\cert.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - name: Install frontend deps
        run: npm ci

      - name: Build the app
        run: npm run tauri build

      - name: Collect + rename installers
        id: pack
        shell: bash
        run: |
          set -e
          shopt -s nullglob globstar
          mkdir -p dist-release
          v="${{ steps.ver.outputs.version }}"
          label="${{ matrix.label }}"
          for f in src-tauri/target/**/release/bundle/**/*.dmg \
                   src-tauri/target/**/release/bundle/**/*.exe \
                   src-tauri/target/**/release/bundle/**/*.msi \
                   src-tauri/target/**/release/bundle/**/*.AppImage \
                   src-tauri/target/**/release/bundle/**/*.deb \
                   src-tauri/target/**/release/bundle/**/*.rpm; do
            ext="${f##*.}"
            dest="dist-release/MeraRAW ${label} ${v}.${ext}"
            cp "$f" "$dest"
            echo "packed: $dest"
          done
          echo "count=$(ls -1 dist-release | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          ls -la dist-release

      - name: Upload run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MeraRAW-${{ matrix.slug }}-${{ steps.ver.outputs.version }}
          path: dist-release/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.6.2
        with:
          files: dist-release/*
