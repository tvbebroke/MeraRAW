[package]
name = "meratech-core"
version = "0.1.7"
edition = "2021"

# RULE: zero Tauri deps. Pure engine, headless-testable.

[dependencies]
meratech-resize = { path = "../resize" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
wgpu = "24"
rawler = "0.7"
# Custom demosaic engine (RCD/LMMSE/AMaZE/IGV/DDFAPD). Core only — we feed it a
# CfaImage built from rawler's rescaled mosaic, so no merawler `decode` feature.
# Vendored under repo `vendor/` so CI/Windows/Linux builds don't need sibling checkouts.
merawler = { path = "../../vendor/MERAWLER" }
# Sidecar demosaic engine: spawns external reference binaries (rawtherapee-cli,
# dcraw_emu) across a process boundary. Contracts validated 2026-07-05:
#   RT native  = Rec.2020 primaries + sRGB TRC + camera WB (decode TRC → working)
#   DHT native = linear camera-native, unity WB, levels forced to rawler's
zerawler = { path = "../../vendor/ZERAWLER" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
# Direct handles to image's own codec crates so we can embed ICC profiles
# (png iCCP / tiff ICCProfile tag) that image::save doesn't expose.
png = "0.17"
tiff = "0.11"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"
tract-onnx = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }
jxl-oxide = "0.12.6"
psd = "0.3.5"
exif = { version = "0.6.1", package = "kamadak-exif" }
lcms2 = { version = "6.1.1", default-features = false, features = ["static"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
