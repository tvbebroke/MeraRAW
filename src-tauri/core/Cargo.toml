[package]
name = "meratech-core"
version = "0.1.1"
edition = "2021"

# RULE: zero Tauri deps. Pure engine, headless-testable.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
wgpu = "24"
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Direct handles to image's own codec crates so we can embed ICC profiles
# (png iCCP / tiff ICCProfile tag) that image::save doesn't expose.
png = "0.17"
tiff = "0.11"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"
tract-onnx = "0.23"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
