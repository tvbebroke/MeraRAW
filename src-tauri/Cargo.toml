[package]
name = "meratech-editor"
version = "0.1.8"
edition = "2021"
description = "MeraRAW RAW Editor"
license = "Apache-2.0"

[workspace]
members = ["core", "resize"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meratech-core = { path = "core" }
tauri = { version = "2", features = ["macos-private-api", "dynamic-acl"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
jsonwebtoken = "9"
open = "5"
url = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
# RAW files are untrusted input and some upstream decoders still contain
# assertions. Keep unwinding enabled so the decoder boundary can turn those
# panics into a per-file error instead of terminating the whole application.
panic = "unwind"
strip = true

# heavy numeric deps (tract inference, rawler decode) stay fast in dev
[profile.dev.package."*"]
opt-level = 2

# workspace members aren't covered by "*"; the resize shim exists precisely
# so the Lanczos monomorphization compiles optimized in dev (see resize/src/lib.rs)
[profile.dev.package.meratech-resize]
opt-level = 2
