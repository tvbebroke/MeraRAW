[package]
name = "meratech-editor"
version = "0.1.2"
edition = "2021"
description = "MeraRAW RAW Editor"

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meratech-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
jsonwebtoken = "9"

[profile.release]
lto = true
opt-level = 3
strip = true

# heavy numeric deps (tract inference, rawler decode) stay fast in dev
[profile.dev.package."*"]
opt-level = 2
