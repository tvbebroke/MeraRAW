# App IPC grants. Identifier must NOT be bare "default" — Tauri capability
# resolution treats that like an empty permission-set and silently skips it,
# which denies every custom command (pick_folder, import_*, etc.).

[[permission]]
identifier = "meraraw-ipc"
description = "Production IPC surface for the main MeraRAW window. Dig/selftest probes are excluded."
commands.allow = [
  "app_info",
  "ping_engine",
  "pick_file",
  "pick_folder",
  "read_file_meta",
  "open_image",
  "request_frame",
  "get_metadata",
  "close_image",
  "apply_op",
  "undo",
  "redo",
  "get_doc",
  "get_history",
  "get_registry",
  "snapshot",
  "list_snapshots",
  "restore_snapshot",
  "virtual_copy",
  "switch_doc",
  "list_docs",
  "delete_virtual_copy",
  "apply_grade_to_paths",
  "save_preset",
  "export_image",
  "export_batch",
  "cancel_export_batch",
  "list_presets",
  "list_preset_catalog",
  "apply_preset",
  "get_perf_stats",
  "denoise_estimate_profile",
  "denoise_models_list",
  "denoise_ai_start",
  "denoise_ai_cancel",
  "denoise_ai_reset",
  "get_stats",
  "wb_from_point",
  "auto_level",
  "set_mask_overlay",
  "set_preview_bypass",
  "set_display_look",
  "set_clip_warnings",
  "set_proof_target",
  "import_folder",
  "scan_import_folder",
  "import_selected",
  "get_asset_detail",
  "list_albums",
  "create_album",
  "delete_album",
  "add_to_album",
  "remove_from_album",
  "set_camera_profile",
  "set_lut",
  "list_looks",
  "user_looks_dir",
  "delete_user_look",
  "seek_video",
  "set_demosaic",
  "pick_lut",
  "get_grid",
  "list_folders",
  "discover_media_folders",
  "list_folder_children",
  "forget_folder",
  "set_asset_meta",
  "rebuild_index",
  "assistant_available",
  "assistant_send",
  "report_problem",
  "reveal_in_finder",
  "license_check_local",
  "license_clear_token",
  "license_verify_token_locally",
  "license_request_otp",
  "license_verify_otp",
  "license_sign_in_and_activate",
  "license_supporter_status",
  "license_start_checkout",
  "open_external_url",
]

[[permission]]
identifier = "allow-dev-probes"
description = "Debug/dig-only IPC probes (selftest, autoopen, frontend status). Not granted in production meraraw-ipc."
commands.allow = [
  "fail_on_purpose",
  "autoopen_path",
  "selftest_enabled",
  "live_assistant_enabled",
  "verify_slider_enabled",
  "report_frontend_status",
]
